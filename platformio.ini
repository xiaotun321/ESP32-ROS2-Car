; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitm-1]
platform = espressif32@6.11.0
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
lib_deps =
    https://github.com/micro-ROS/micro_ros_arduino.git#v2.0.8-jazzy
; Windows build: use the Jazzy precompiled archive; Wi-Fi is set up in ros_wifi.cpp.
lib_ignore = micro_ros_platformio
extra_scripts = pre:tools/link_microros.py
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D MICRO_ROS_WIFI_SSID=\"804\"
    -D MICRO_ROS_WIFI_PASSWORD=\"LG18601793229\"
    -D MICRO_ROS_AGENT_IP=\"192.168.0.107\"
    -D MICRO_ROS_AGENT_PORT=8888
    -D MICRO_ROS_DOMAIN_ID=0
