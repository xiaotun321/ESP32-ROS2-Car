; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 921600
upload_speed = 921600
upload_protocol = esptool


lib_deps =
    https://gitee.com/ohhuo/micro_ros_platformio.git
    
; 必须与树莓派 ROS_DISTRO 一致；实际树莓派使用 ROS 2 Jazzy。
board_microros_distro = jazzy
board_microros_transport = wifi


build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D MICRO_ROS_WIFI_SSID=\"MIFI-38FF\"
    -D MICRO_ROS_WIFI_PASSWORD=\"jie123456\"
    ; 改成树莓派连接 MIFI-38FF 后的实际 IP：hostname -I
    -D MICRO_ROS_AGENT_IP=\"192.168.0.100\"
    -D MICRO_ROS_AGENT_PORT=8888
