; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitm-1]
platform = espressif32@6.11.0
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
lib_deps =
    https://github.com/micro-ROS/micro_ros_arduino.git#v2.0.8-jazzy
; Windows build: use the Jazzy precompiled archive; the USB serial transport
; is set up in ros_agent.cpp.
lib_ignore = micro_ros_platformio
extra_scripts = pre:tools/link_microros.py
build_flags =
    ; Native USB CDC (Serial) carries the micro-ROS serial agent traffic.
    ; The command console and logs stay on UART0 (Serial0).
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D MICRO_ROS_SERIAL_BAUD=115200
    -D MICRO_ROS_DOMAIN_ID=0
